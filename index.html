<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>The Personal Hub | Notion Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="hub-container">
        <header class="hub-header">
            <h1>The Personal Hub</h1>
            <div class="quick-nav">
                <span>Quick Travel Pad</span>
                <span>Setup Instructions</span>
                <span>Quick Links</span>
            </div>
        </header>

        <section class="hub-grid">
            <div class="glass-box">
                <h3>TODAY'S REMINDERS</h3>
                <ul class="task-checklist">
                    <li><input type="checkbox" checked> Drink water goal (2.5L)</li>
                    <li><input type="checkbox"> Review weekly performance metrics</li>
                    <li><input type="checkbox"> Deep work session (2 hours)</li>
                </ul>
            </div>

            <div class="glass-box weather-box">
                <h3>WEATHER</h3>
                <div class="weather-info">
                    <h1>81°F</h1>
                    <p>Winter Park, United States</p>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
